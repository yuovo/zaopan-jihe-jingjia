name: 09:26 云端竞价定稿

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auction-0926-canonical
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 读取仓库
        uses: actions/checkout@v7

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: 安装浏览器依赖
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: 自动生成09:25定稿
        run: npm run capture

      - name: 提交云端榜单
        run: |
          if git diff --quiet -- auction-current.js; then
            echo "云端榜单没有变化"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auction-current.js
          git commit -m "自动更新 $(TZ=Asia/Shanghai date +%F) 09:25 云端定稿"
          git push
